name: Deploy site
# Build -> technical SEO checks -> publish typingocto/ to the gh-pages branch (GitHub Pages source) -> smoke test.
# Triggered by any push to main, including the commits made by TypingOcto SEO Intelligence
# when an APPROVED article reaches its scheduled date (content/blog/<slug>.json).
on:
  push:
    branches: [main]
    paths: ['typingocto/**', 'tools/**', 'content/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build static site (pages, blog, sitemap, RSS)
        run: node tools/build.js
      - name: Technical SEO and safety checks
        run: node tools/check.js
      - name: Publish to gh-pages
        run: |
          cd typingocto
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}: ${HEAD_MSG:0:120}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          # passed through env (never interpolated into the script): commit messages can contain article titles
          HEAD_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test (after GitHub Pages rebuild)
        run: |
          for i in $(seq 1 20); do
            sleep 20
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://typingocto.com/sitemap.xml?ci=$GITHUB_RUN_ID")
            body=$(curl -s "https://typingocto.com/sitemap.xml?ci=$GITHUB_RUN_ID")
            missing=0
            for f in content/blog/*.json; do [ -e "$f" ] || continue; s=$(basename "$f" .json); echo "$body" | grep -q "/blog/$s.html" || missing=1; done
            if [ "$code" = "200" ] && [ "$missing" = "0" ]; then echo "Live and up to date"; exit 0; fi
            echo "Waiting for Pages (status $code, missing=$missing)..."
          done
          echo "::warning::The site did not show the new content within ~7 minutes (Pages cache). The SEO engine keeps verifying each article URL before marking it as published."
